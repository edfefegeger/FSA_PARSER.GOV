; ============================================================
;  Настройки парсера реестра ФСА
;  Открывается обычным Блокнотом. Сохраняйте в кодировке UTF-8.
;  Строки, начинающиеся с ; — комментарии.
; ============================================================

[filter]
; За сколько дней до окончания документа включать запись в выгрузку
days_threshold = 60

; Фильтр по техническому регламенту (ТР ТС / ТР ЕАЭС). Отбор делает сам сайт.
; Можно писать полностью или только номером. Несколько - через запятую.
; Пусто - брать документы по любым ТР.
; Полный список: запустите  python fsa_parser.py --list-tr
tech_regs = ТР ТС 021/2011, ТР ТС 033/2013, ТР ТС 034/2013

; Дополнительный фильтр по словам в названии продукции (необязательно).
; Пусто - слова не используются, достаточно ТР. Если указать, документ должен
; подходить и по ТР, и по слову. "молок" найдёт "молоко", "молоком"; "молоч" - "молочная".
product_keywords =

; Что собирать: certificates, declarations или оба через запятую
document_types = certificates, declarations

[output]
; Формат файла: xlsx, csv или both
format = both

; Папка для выгрузок (создаётся автоматически)
output_dir = выгрузки

; Префикс имени файла. Итог: fsa_60_days_2026-09-24.xlsx
file_prefix = fsa

; Порядок и состав столбцов. Ненужные уберите, порядок меняйте как угодно.
; Доступно: company, head, last_name, first_name, patronymic, number, doc_type,
;           tech_reg, end_date, days_left, email, product
; tech_reg - наименование ТР ТС, по которому оформлен документ.
; head - ФИО одной ячейкой; last_name, first_name, patronymic - Фамилия, Имя, Отчество отдельно.
columns = company, last_name, first_name, patronymic, number, doc_type, tech_reg, end_date, days_left, email, product

; Регистр ФИО: title - Иванов Иван Иванович (в реестре часто ИВАНОВ ИВАН ИВАНОВИЧ),
; registry - как в реестре, без изменений.
name_case = title

; Подсвечивать красным документы, которые истекают в течение N дней
urgent_days = 30

; Сколько первых строк показать в консоли
preview_rows = 7

[network]
; Размер страницы при загрузке реестра (на сайте максимум 100)
page_size = 100
; Пауза между запросами, сек. Не уменьшайте сильно - сайт может ограничить доступ
delay = 1.0
; Каждые batch_size запросов - длинная пауза batch_pause секунд (щадящий режим)
batch_size = 100
batch_pause = 30
; Максимум запросов за один запуск (0 - без лимита). Если сайт банит - поставьте 300:
; парсер остановится сам, сохранит частичный файл, а следующий запуск продолжит.
max_requests = 0
; Число повторов при сетевой ошибке
retries = 4
; Реестр читается окнами по N дней (сайт не отдаёт слишком глубокие страницы)
chunk_days = 3

; Прокси. Пусто - использовать системные переменные (HTTPS_PROXY / HTTP_PROXY).
; none - не использовать прокси вообще. Либо адрес: http://127.0.0.1:10809
; Сайт ФСА может открываться только с российских IP - тогда нужен прокси/VPN.
proxy = none

[cache]
; Найденное сохраняется сюда - при обрыве/блокировке повторный запуск продолжает с места остановки
cache_dir = cache
; Сколько дней хранить данные заявителей (руководитель, e-mail). Повторные запуски почти не нагружают сайт
details_ttl_days = 30
; Один запрос на заявителя, даже если у него много документов (сильно меньше запросов)
dedupe_applicants = true
